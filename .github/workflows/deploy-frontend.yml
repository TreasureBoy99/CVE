name: Deploy Frontend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Restore CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1

      - name: Run CVE Crawler (generate cve_cache.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python -c "from backend.cve_crawler import CVECrawler; CVECrawler().fetch_latest_cves(days_back=7)"

      - name: Save CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build
        run: |
          cd frontend
          npm run build
          touch out/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          branch: gh-pages
          folder: frontend/out
          clean: true
          single-commit: true
