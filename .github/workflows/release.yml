name: Auto Release

on:
  # Triggered after schedule.yml completes all jobs
  workflow_run:
    workflows: ["CVE Schedule"]
    types: [completed]
    branches: [main]

  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag override (e.g. v2026-07-27), leave empty for auto'
        required: false
        default: ''

jobs:
  release:
    if: github.repository == 'anonymous99-Rise/CVE'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read CVE stats
        id: stats
        run: |
          import json, os

          data_path = os.path.join(os.getcwd(), 'data', 'cves.json')
          if os.path.exists(data_path):
              with open(data_path) as f:
                  data = json.load(f)
              meta = data.get('cveMetadata', {})
              dist = meta.get('severity_distribution', {})
              count = meta.get('total_count', 0)
              last_updated = meta.get('last_updated', '')
              cves = data.get('cves', [])
              print(f"count={count}", flush=True)
              print(f"last_updated={last_updated}", flush=True)
              print(f"critical={dist.get('critical', 0)}", flush=True)
              print(f"high={dist.get('high', 0)}", flush=True)
              print(f"medium={dist.get('medium', 0)}", flush=True)
              print(f"low={dist.get('low', 0)}", flush=True)
              print(f"none={dist.get('none', 0)}", flush=True)
              # Write to file to avoid GITHUB_OUTPUT conflict
              with open(os.path.join(os.getcwd(), 'stats.json'), 'w') as f:
                  json.dump({'count': count, 'last_updated': last_updated,
                             'dist': dist, 'cves': cves[:10]}, f)
          else:
              print("count=0", flush=True)
              print("last_updated=", flush=True)
              with open(os.path.join(os.getcwd(), 'stats.json'), 'w') as f:
                  json.dump({'count': 0, 'last_updated': '', 'dist': {}, 'cves': []}, f)

      - name: Decide version tag
        id: version
        run: |
          import os, datetime, json

          # workflow_dispatch passes inputs via GITHUB_EVENT_PATH
          event_path = os.getenv('GITHUB_EVENT_PATH', '')
          manual = ''
          if event_path and os.path.exists(event_path):
              with open(event_path) as f:
                  event = json.load(f)
              manual = (event.get('inputs', {}) or {}).get('version', '')

          manual = manual.strip()
          if manual:
              tag = manual
          else:
              tag = f"v{datetime.date.today().strftime('%Y-%m-%d')}"

          print(f"version={tag}", flush=True)

          # Read previous tag
          import subprocess
          result = subprocess.run(
              ['git', 'tag', '--sort=-v:refname', '--list', 'v*'],
              capture_output=True, text=True
          )
          tags = [t.strip() for t in result.stdout.strip().split('\n') if t.strip()]
          prev = tags[0] if tags else 'v0.0.0'
          print(f"previous_tag={prev}", flush=True)

      - name: Check if tag exists
        id: skip_check
        run: |
          import subprocess, os
          version = os.getenv('VERSION', '')
          result = subprocess.run(['git', 'tag', '-l', version], capture_output=True, text=True)
          if result.stdout.strip():
              print("skip=true")
          else:
              print("skip=false")

      - name: Create GitHub Release
        if: steps.skip_check.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          import json, os, subprocess, datetime

          with open('stats.json') as f:
              stats = json.load(f)

          count = stats['count']
          dist = stats['dist']
          last_updated = stats['last_updated']
          cves = stats['cves']

          # Build release body
          lines = [
              f"## 📋 CVE 数据更新 — {os.getenv('VERSION')}",
              "",
              f"**更新时间：** {last_updated}",
              f"**收录总数：** {count} 条",
              "",
              "### 严重性分布",
              f"- 🔴 Critical: **{dist.get('critical', 0)}**",
              f"- 🟠 High: **{dist.get('high', 0)}**",
              f"- 🟡 Medium: **{dist.get('medium', 0)}**",
              f"- 🟢 Low: **{dist.get('low', 0)}**",
              f"- ⚪ N/A: **{dist.get('none', 0)}**",
              "",
              "### 最新 CVE",
          ]

          for cve in cves:
              sev = cve.get('severity', '?')
              icon = '🔴' if float(sev or 0) >= 9 else '🟠' if float(sev or 0) >= 7 else '🟡'
              desc = (cve.get('description') or '无描述')[:100]
              lines.append(f"- {icon} **{cve['id']}** CVSS {sev} — {desc}...")

          lines.append("")
          lines.append("---")
          lines.append("*🤖 由 CVE Monitor 自动生成*")

          body = '\n'.join(lines)

          # Write body to file for gh CLI
          body_file = os.path.join(os.getcwd(), 'release_body.md')
          with open(body_file, 'w', encoding='utf-8') as f:
              f.write(body)

          # Configure git
          subprocess.run(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'])
          subprocess.run(['git', 'config', 'user.name', 'CVE Monitor Release'])

          # Create tag
          subprocess.run([
              'git', 'tag', '-a', os.getenv('VERSION'), '-m',
              f"CVE Release {os.getenv('VERSION')} — {count} CVEs tracked"
          ])

          # Push tag (this triggers the release)
          result = subprocess.run(
              ['git', 'push', 'origin', os.getenv('VERSION'), '--quiet'],
              capture_output=True, text=True
          )
          if result.returncode == 0:
              print(f"✅ Pushed tag {os.getenv('VERSION')}")
          else:
              print(f"❌ Push failed: {result.stderr.decode()}")
              exit(1)

          print(f"\n📦 Release {os.getenv('VERSION')} created")

      - name: Post summary
        if: always()
        run: |
          import json, os
          with open('stats.json') as f:
              stats = json.load(f)

          version = os.getenv('VERSION', 'unknown')

          echo "### 📦 Release $version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 指标 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|----|" >> $GITHUB_STEP_SUMMARY
          echo "| CVE 总数 | ${stats['count']} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | ${stats['dist'].get('critical', 0)} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | ${stats['dist'].get('high', 0)} |" >> $GITHUB_STEP_SUMMARY
          echo "| 更新于 | ${stats['last_updated']} |" >> $GITHUB_STEP_SUMMARY
