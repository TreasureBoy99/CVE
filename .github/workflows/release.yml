name: Auto Release

on:
  workflow_run:
    workflows: ["CVE Schedule"]
    types: [completed]
    branches: [main]

  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026-07-27)'
        required: false
        default: ''

jobs:
  release:
    if: github.repository == 'anonymous99-Rise/CVE'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # need full history for changelog

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Read current CVE count
        id: stats
        run: |
          import json, os
          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'data', 'cves.json')
          if os.path.exists(path):
              with open(path) as f:
                  data = json.load(f)
              count = data.get('cveMetadata', {}).get('total_count', 0)
              last_updated = data.get('cveMetadata', {}).get('last_updated', '')
              print(f"count={count}")
              print(f"last_updated={last_updated}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write(f"count={count}\n")
                  out.write(f"last_updated={last_updated}\n")
          else:
              print("count=0")
              print("last_updated=")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write("count=0\n")
                  out.write("last_updated=\n")

      - name: Read previous release tag
        id: prev_tag
        run: |
          import subprocess
          result = subprocess.run(
              ['git', 'tag', '--sort=-v:refname', '--list', 'v*'],
              capture_output=True, text=True
          )
          tags = result.stdout.strip().split('\n')
          tags = [t for t in tags if t]
          prev = tags[0] if tags else 'v0.0.0'
          print(f"previous_tag={prev}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"previous_tag={prev}\n")

      - name: Decide version
        id: version
        run: |
          import os, datetime
          manual = os.environ.get('INPUT_VERSION', '').strip()
          if manual:
              print(f"version={manual}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write(f"version={manual}\n")
          else:
              today = datetime.date.today().strftime('%Y-%m-%d')
              v = f"v{today}"
              print(f"version={v}")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write(f"version={v}\n")

      - name: Generate changelog excerpt
        id: changelog
        run: |
          import json, datetime, os

          path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'data', 'cves.json')
          if not os.path.exists(path):
              print("changelog=No data")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write("changelog=No data\n")
              exit(0)

          with open(path) as f:
              data = json.load(f)

          cves = data.get('cves', [])
          meta = data.get('cveMetadata', {})
          dist = meta.get('severity_distribution', {})

          lines = [
              f"## 📋 CVE 数据更新 — {os.environ.get('VERSION', 'Unknown')}",
              "",
              f"**更新时间：** {meta.get('last_updated', '-')}",
              f"**收录数量：** {meta.get('total_count', 0)} 条",
              "",
              "### 严重性分布",
              f"- 🔴 Critical: **{dist.get('critical', 0)}**",
              f"- 🟠 High: **{dist.get('high', 0)}**",
              f"- 🟡 Medium: **{dist.get('medium', 0)}**",
              f"- 🟢 Low: **{dist.get('low', 0)}**",
              f"- ⚪ N/A: **{dist.get('none', 0)}**",
              "",
              "### 最新 CVE",
          ]

          for cve in sorted(cves, key=lambda x: x.get('publishedDate', ''), reverse=True)[:10]:
              sev = cve.get('severity', '?')
              icon = '🔴' if float(sev or 0) >= 9 else '🟠' if float(sev or 0) >= 7 else '🟡'
              lines.append(f"- {icon} **{cve['id']}** CVSS {sev} — {cve.get('description', '无描述')[:80]}...")

          changelog = '\n'.join(lines)

          # Write to file for use in step summary
          with open(os.path.join(os.environ['GITHUB_OUTPUT']), 'a') as out:
              out.write(f"changelog={json.dumps(changelog)}\n")

          # Also print to stdout for the summary
          print(changelog)

      - name: Create or update release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.prev_tag.outputs.previous_tag }}
          COUNT: ${{ steps.stats.outputs.count }}
        run: |
          import subprocess, json, os

          # Check if tag already exists
          result = subprocess.run(
              ['git', 'tag', '-l', os.environ['VERSION']],
              capture_output=True, text=True
          )
          if result.stdout.strip():
              print(f"Tag {os.environ['VERSION']} already exists — skipping release")
              exit(0)

          # Lightweight tag + push
          subprocess.run(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'])
          subprocess.run(['git', 'config', 'user.name', 'CVE Monitor Release'])
          subprocess.run(['git', 'tag', '-a', os.environ['VERSION'], '-m',
                         f"CVE Release {os.environ['VERSION']} — {os.environ['COUNT']} CVEs tracked"])
          subprocess.run(['git', 'push', 'origin', os.environ['VERSION'], '--quiet'])

          print(f"✅ Released {os.environ['VERSION']}")

      - name: Post release note
        if: always()
        run: |
          echo "### 📦 Release ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Released: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "Previous: ${{ steps.prev_tag.outputs.previous_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "CVE Count: ${{ steps.stats.outputs.count }}" >> $GITHUB_STEP_SUMMARY
