name: Auto Release

on:
  # Runs after any schedule.yml job completes.
  # On scheduled days, multiple jobs fire — we dedupe via tag existence check.
  workflow_run:
    workflows: ["CVE Schedule"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026-07-27), leave empty for auto'
        required: false
        default: ''

jobs:
  release:
    if: github.repository == 'anonymous99-Rise/CVE'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Determine mode
        id: mode
        run: |
          import os, json

          # Determine version tag
          manual = ''
          event_path = os.getenv('GITHUB_EVENT_PATH', '')
          if event_path and os.path.exists(event_path):
              with open(event_path) as f:
                  event = json.load(f)
              manual = ((event.get('inputs') or {}) or {}).get('version', '')

          manual = manual.strip()
          tag = manual if manual else f"v{os.getenv('GITHUB_SHA', '')[:8]}-{__import__('datetime').date.today().strftime('%Y-%m-%d')}"
          print(f"VERSION={tag}", flush=True)
          with open(os.getenv('GITHUB_OUTPUT', ''), 'a') as f:
              f.write(f"VERSION={tag}\n")

      - name: Check if tag already exists
        id: skip
        env:
          VERSION: ${{ steps.mode.outputs.VERSION }}
        run: |
          import subprocess, os
          tag = os.environ.get('VERSION', '')
          result = subprocess.run(['git', 'tag', '-l', tag], capture_output=True, text=True)
          if result.stdout.strip():
              print(f"Tag {tag} already exists — skip release", flush=True)
              with open(os.getenv('GITHUB_OUTPUT', ''), 'a') as f:
                  f.write("SKIP=true\n")
          else:
              print(f"Tag {tag} not found — will create release", flush=True)
              with open(os.getenv('GITHUB_OUTPUT', ''), 'a') as f:
                  f.write("SKIP=false\n")

      - name: Prepare release data
        if: steps.skip.outputs.SKIP != 'true'
        id: prepare
        run: |
          import json, os

          data_path = os.path.join(os.getcwd(), 'data', 'cves.json')
          if os.path.exists(data_path):
              with open(data_path) as f:
                  data = json.load(f)
              meta = data.get('cveMetadata', {})
              dist = meta.get('severity_distribution', {})
              count = meta.get('total_count', 0)
              last_updated = meta.get('last_updated', '')
              cves = data.get('cves', [])[:10]
          else:
              count, last_updated = 0, ''
              dist = {}
              cves = []

          # Write release body
          lines = [
              f"## 📋 CVE 数据更新",
              "",
              f"**更新时间：** {last_updated}",
              f"**收录总数：** {count} 条",
              "",
              "### 严重性分布",
              f"- 🔴 Critical: **{dist.get('critical', 0)}**",
              f"- 🟠 High: **{dist.get('high', 0)}**",
              f"- 🟡 Medium: **{dist.get('medium', 0)}**",
              f"- 🟢 Low: **{dist.get('low', 0)}**",
              f"- ⚪ N/A: **{dist.get('none', 0)}**",
              "",
              "### 最新 CVE",
          ]
          for cve in cves:
              sev = cve.get('severity', '?')
              icon = '🔴' if float(sev or 0) >= 9 else '🟠' if float(sev or 0) >= 7 else '🟡'
              desc = ((cve.get('description') or '无描述')[:100]).replace('\n', ' ')
              lines.append(f"- {icon} **{cve['id']}** CVSS {sev} — {desc}...")
          lines.append("")
          lines.append("---")
          lines.append("*🤖 由 CVE Monitor 自动生成*")

          body = '\n'.join(lines)
          with open('release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)

          # Write summary stats
          summary = f"## 📦 Release\n\n- **CVE 总数：** {count}\n- **更新于：** {last_updated}\n"
          with open('release_summary.md', 'w') as f:
              f.write(summary)

          print(f"Prepared release body: {count} CVEs")

      - name: Create Git tag
        if: steps.skip.outputs.SKIP != 'true'
        env:
          VERSION: ${{ steps.mode.outputs.VERSION }}
        run: |
          import subprocess, os
          tag = os.environ.get('VERSION', '')
          subprocess.run(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'])
          subprocess.run(['git', 'config', 'user.name', 'CVE Monitor Release'])
          subprocess.run(['git', 'tag', '-a', tag, '-m', f'CVE Release {tag}'])
          result = subprocess.run(
              ['git', 'push', 'origin', f'tags/{tag}', '--quiet'],
              capture_output=True, text=True
          )
          if result.returncode == 0:
              print(f"✅ Tag {tag} pushed")
          else:
              print(f"❌ Push failed: {result.stderr.decode()}")
              exit(1)

      - name: Create GitHub Release
        if: steps.skip.outputs.SKIP != 'true'
        env:
          VERSION: ${{ steps.mode.outputs.VERSION }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.VERSION;
            const body = fs.readFileSync('release_body.md', 'utf8');
            try {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: '📋 CVE Update — ' + tag,
                body: body,
                draft: false,
                prerelease: false
              });
              console.log('✅ Release created: ' + tag);
            } catch (e) {
              // Tag might already exist from a concurrent run
              if (e.status === 422) {
                console.log('Release already exists: ' + tag);
              } else {
                throw e;
              }
            }

      - name: Step summary
        if: always()
        run: |
          import json, os
          summary = ''
          if os.path.exists('release_summary.md'):
              with open('release_summary.md') as f:
                  summary = f.read()
          version = os.getenv('VERSION', 'unknown')
          skip = os.getenv('SKIP', 'false')
          with open(os.getenv('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write(f"## 📦 Release: {version}\n\n")
              if skip == 'true':
                  f.write("*Tag already existed — skipped.*\n\n")
              else:
                  f.write("*Created new release.*\n\n")
              f.write(summary)
