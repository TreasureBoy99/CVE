# DEPRECATED — functionality merged into schedule.yml
# Kept here only for back-compat with any existing manual workflow_dispatch references.
# The schedule.yml handles all scheduled runs.
name: CVE Update (Deprecated)

on:
  workflow_dispatch:
    inputs:
      params:
        description: 'Extra args passed to update_cves.py'
        required: false
        default: ''

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Run update
        run: |
          EXTRA="${{ github.event.inputs.params }}"
          if [ -z "$EXTRA" ]; then
            python scripts/update_cves.py daily --days 7
          else
            python scripts/update_cves.py daily --days 7 $EXTRA
          fi

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "CVE Monitor"
          git add data/ frontend/public/ logs/ 2>/dev/null || true
          if ! git diff --quiet; then
            git commit -m "CVE data update $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes to commit"
          fi
