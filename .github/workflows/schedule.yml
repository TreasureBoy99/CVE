name: CVE Schedule

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 9 * * 1'
    - cron: '0 9 * * 3'
    - cron: '0 9 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (daily/weekly/poc/scan/diff)'
        required: false
        default: ''
      days:
        description: '--days value'
        required: false
        default: '7'
      year:
        description: '--year value (scan mode)'
        required: false
        default: '2026'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

jobs:
  # ── Frequent (every 5 min) — no enrich, skip cache ─────────────────────────
  frequent:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Frequent update
        run: python scripts/update_cves.py daily --days 7 --no-enrich

      - name: Commit
        run: |
          set -x
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "CVE Monitor"
          echo "=== File bytes before add ==="
          bytes_worktree=$(wc -c < data/cves.json)
          bytes_head=$(git show HEAD:data/cves.json | wc -c)
          echo "cves.json worktree=$bytes_worktree HEAD=$bytes_head"
          echo "deltaLog worktree=$(wc -c < data/deltaLog.json 2>/dev/null || echo missing), HEAD=$(git show HEAD:data/deltaLog.json | wc -c)"
          echo "cve_cache worktree=$(wc -c < frontend/public/cve_cache.json 2>/dev/null || echo missing)"
          echo "=== git status before add ==="
          git status --short
          echo "=== git add data/ frontend/public/ logs/ ==="
          git add data/ frontend/public/ logs/
          echo "=== git status after add ==="
          git status --short
          echo "=== git diff --name-only vs HEAD ==="
          git diff --name-only HEAD
          echo "=== git diff --cached --name-only vs HEAD ==="
          git diff --cached --name-only HEAD
          echo "=== worktree cves.json head ==="
          head -3 data/cves.json
          echo "=== HEAD cves.json head ==="
          git show HEAD:data/cves.json | head -3
          echo "=== MD5 worktree cves.json ==="
          md5sum data/cves.json
          echo "=== MD5 HEAD cves.json ==="
          git show HEAD:data/cves.json | md5sum
          if ! git diff --quiet HEAD; then
            echo "COMMITTING"
            git commit -m "Frequent CVE update $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "NO_CHANGES"
          fi

  # ── Weekly report (Monday) ──────────────────────────────────────────────────
  weekly:
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1
          restore-keys: |
            cve-db-v1

      - name: Show cache stats
        run: |
          python << 'EOF'
          from backend.analyzer import CVEAnalyzer
          s = CVEAnalyzer().cache_stats()
          print(f"Cache: {s['total']} total, {s['stale']} stale")
          EOF

      - name: Weekly full report
        run: python scripts/update_cves.py weekly --days 7

      - name: Save CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "CVE Monitor"
          git add data/ frontend/public/ logs/ 2>/dev/null || true
          if ! git diff --quiet; then
            git commit -m "Weekly CVE report $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Create Weekly Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dataPath = `${process.env.GITHUB_WORKSPACE}/data/cves.json`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['weekly-report'],
              state: 'open'
            });
            const today = new Date().toLocaleDateString('zh-CN', {
              year: 'numeric', month: 'long', day: 'numeric'
            });
            const title = '📋 周报 · ' + today;
            let body = '## 📊 本周漏洞态势\n\n';
            if (fs.existsSync(dataPath)) {
              const d = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
              const m = d.cveMetadata || {};
              const dist = m.severity_distribution || {};
              const cves = d.cves || [];
              const weekStart = new Date();
              weekStart.setDate(weekStart.getDate() - 7);
              const weekCount = cves.filter(c => new Date(c.publishedDate) >= weekStart).length;
              body += '**本周新增/更新：** ' + weekCount + ' 条 CVE\n\n';
              body += '| 严重性 | 数量 |\n|--------|------|\n';
              body += '| 🔴 Critical | **' + (dist.critical || 0) + '** |\n';
              body += '| 🟠 High | **' + (dist.high || 0) + '** |\n';
              body += '| 🟡 Medium | **' + (dist.medium || 0) + '** |\n';
              body += '| 🟢 Low | **' + (dist.low || 0) + '** |\n';
              body += '| ⚪ N/A | **' + (dist.none || 0) + '** |\n\n';
              body += '> 数据更新时间：' + (m.last_updated || '-') + '\n';
            }
            body += '\n## 📋 详情列表\n\n本周完整报告已生成并保存至 `data/cves.json`。\n\n---\n*🤖 由 CVE Monitor 自动生成*';
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title: title,
                body: body,
                state: 'open'
              });
              console.log('Updated issue #' + issues[0].number);
            } else {
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['weekly-report']
              });
              console.log('Created issue #' + newIssue.number);
            }

  # ── Year scan (Wednesday) ──────────────────────────────────────────────────
  scan-year:
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1
          restore-keys: |
            cve-db-v1

      - name: Scan 2026 CVEs
        run: python scripts/update_cves.py scan --year 2026 --days 365

      - name: Save CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "CVE Monitor"
          git add data/ frontend/public/ logs/ 2>/dev/null || true
          if ! git diff --quiet; then
            git commit -m "2026 CVE scan $(date +'%Y-%m-%d')"
            git push
          fi

  # ── PoC report (Friday) ────────────────────────────────────────────────────
  poc-report:
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1
          restore-keys: |
            cve-db-v1

      - name: PoC report
        run: python scripts/update_cves.py poc --days 30

      - name: Save CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "CVE Monitor"
          git add data/ frontend/public/ logs/ 2>/dev/null || true
          if ! git diff --quiet; then
            git commit -m "PoC CVE report $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Create PoC Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dataPath = `${process.env.GITHUB_WORKSPACE}/data/cves.json`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['poc-report'],
              state: 'open'
            });
            const today = new Date().toLocaleDateString('zh-CN', {
              year: 'numeric', month: 'long', day: 'numeric'
            });
            const title = '⚠️ PoC 漏洞报告 · ' + today;
            let body = '## ⚠️ 已知被利用漏洞 — 近期 PoC 汇总\n\n';
            body += '> 本报告仅收录 **CISA KEV** 标记或 **GitHub Advisory** 记录存在已知漏洞利用的 CVE，请 **优先修复** 以下漏洞！\n\n';
            if (fs.existsSync(dataPath)) {
              const d = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
              const cves = (d.cves || []).slice(0, 30);
              if (cves.length === 0) {
                body += '✅ 近期无新增已知被利用的 CVE\n';
              } else {
                cves.forEach(c => {
                  const sev = c.severity || '?';
                  const icon = parseFloat(sev) >= 9 ? '🔴' : parseFloat(sev) >= 7 ? '🟠' : '🟡';
                  const hasKev = c.cisa_kev ? ' ⚠️ **CISA KEV**' : '';
                  const desc = ((c.description || '').slice(0, 100)).replace(/\n/g, ' ');
                  body += '- ' + icon + ' **' + c.id + '** CVSS ' + sev + hasKev + '\n  ' + desc + '...\n';
                });
              }
            }
            body += '\n---\n*🤖 由 CVE Monitor 自动生成 · ' + new Date().toUTCString() + '*';
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title: title,
                body: body,
                state: 'open'
              });
              console.log('Updated PoC issue #' + issues[0].number);
            } else {
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['poc-report']
              });
              console.log('Created PoC issue #' + newIssue.number);
            }

  # ── Manual dispatch ────────────────────────────────────────────────────────
  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1
          restore-keys: |
            cve-db-v1

      - name: Manual run
        run: |
          MODE=${{ github.event.inputs.mode }}
          if [ -z "$MODE" ]; then
            python scripts/update_cves.py daily --days 7
          else
            python scripts/update_cves.py $MODE --days ${{ github.event.inputs.days }} --year ${{ github.event.inputs.year }}
          fi

      - name: Save CVE cache
        uses: actions/cache@v4
        with:
          path: ~/.cve-monitor
          key: cve-db-v1

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "CVE Monitor"
          git add data/ frontend/public/ logs/ 2>/dev/null || true
          if ! git diff --quiet; then
            git commit -m "Manual CVE update $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
